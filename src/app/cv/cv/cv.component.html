<div class="row">
  <div class="col">
    <div class="alert alert-warning">
      {{ date | date : "full" | uppercase }}
    </div>

    <app-list [cvs]="cvs()"></app-list>
  </div>

  <div class="col">
    <app-cv-card [cv]="selectedCv()"></app-cv-card>
  </div>
</div>

<!-- embauche sera chargé après un délai -->
<ng-container *ngIf="showEmbauche">
  <ng-container *ngComponentOutlet="embaucheComponent"></ng-container>
</ng-container>
